name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskwise
          POSTGRES_PASSWORD: example
          POSTGRES_DB: taskwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taskwise:example@localhost:5432/taskwise_test
      DIRECT_URL: postgresql://taskwise:example@localhost:5432/taskwise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Dependency audit (reported, does not block)
        run: npm audit --audit-level=high
        continue-on-error: true