<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlexaTasker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f4f1ea;
    color: #2b2b28;
    margin: 0;
    padding: 2.5rem 1.5rem;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 {
    font-size: 1.6rem;
    font-weight: normal;
    letter-spacing: 0.02em;
    margin-bottom: 0.2rem;
    border-bottom: 2px solid #2b2b28;
    padding-bottom: 0.5rem;
  }
  .subtitle {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: #6b675f;
    font-size: 0.85rem;
    margin-bottom: 2rem;
  }
  .add-form {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  input[type="text"], input[type="date"] {
    background: #fff;
    border: 1px solid #ccc7ba;
    color: #2b2b28;
    padding: 0.55rem 0.7rem;
    font-size: 0.9rem;
  }
  input[type="text"] { flex: 1; }
  button {
    background: #2b2b28;
    color: #f4f1ea;
    border: none;
    padding: 0.55rem 1rem;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    letter-spacing: 0.03em;
  }
  button:hover { background: #4a4944; }
  .task {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #ddd8cc;
    padding: 0.7rem 0.1rem;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .task-title { font-size: 0.95rem; }
  .task-due { color: #8a8577; font-size: 0.8rem; margin-left: 0.5rem; }
  .done-btn {
    background: transparent;
    color: #6b675f;
    border: 1px solid #ccc7ba;
    padding: 0.25rem 0.6rem;
    font-size: 0.75rem;
  }
  .done-btn:hover { background: #ddd8cc; color: #2b2b28; }
  .plan-btn {
    width: 100%;
    margin-top: 1.5rem;
    padding: 0.7rem;
    background: transparent;
    color: #2b2b28;
    border: 1px solid #2b2b28;
  }
  .plan-btn:hover { background: #2b2b28; color: #f4f1ea; }
  .plan-output {
    border-left: 3px solid #2b2b28;
    padding: 0.8rem 1rem;
    margin-top: 1rem;
    white-space: pre-wrap;
    font-size: 0.9rem;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: none;
  }
  .empty {
    color: #8a8577;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.85rem;
    padding: 0.8rem 0.1rem;
  }
  .error-box {
    color: #b00020;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.85rem;
    padding: 0.8rem 0.1rem;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>AlexaTasker</h1>
    <p class="subtitle">A task list for Alexa+</p>

    <div class="add-form">
      <input type="text" id="taskInput" placeholder="Add a task" />
      <input type="date" id="dueInput" />
      <button onclick="addTask()">Add</button>
    </div>

    <div id="taskList"></div>

    <button class="plan-btn" onclick="planDay()">Plan my day</button>
    <div id="planOutput" class="plan-output"></div>
  </div>

  <script>
    const API_BASE = "https://alexatasker.onrender.com";
    let sessionId = null;
    let initPromise = null;

    function showError(msg) {
      const listEl = document.getElementById("taskList");
      listEl.innerHTML = `<div class="error-box">Error: ${msg}</div>`;
    }

    async function ensureInitialized() {
      if (sessionId) return;
      if (initPromise) return initPromise;

      initPromise = (async () => {
        const res = await fetch(`${API_BASE}/mcp`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json, text/event-stream"
          },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: 1,
            method: "initialize",
            params: {
              protocolVersion: "2025-11-25",
              capabilities: {},
              clientInfo: { name: "alexatasker-dashboard", version: "0.1.0" }
            }
          }),
        });
        if (!res.ok) {
          throw new Error(`Initialize failed with status ${res.status}`);
        }
        sessionId = res.headers.get("mcp-session-id");

        await fetch(`${API_BASE}/mcp`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json, text/event-stream",
            ...(sessionId ? { "Mcp-Session-Id": sessionId } : {})
          },
          body: JSON.stringify({
            jsonrpc: "2.0",
            method: "notifications/initialized"
          }),
        });
      })();

      return initPromise;
    }

    async function callTool(name, args = {}) {
      try {
        await ensureInitialized();
        const res = await fetch(`${API_BASE}/mcp`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json, text/event-stream",
            ...(sessionId ? { "Mcp-Session-Id": sessionId } : {})
          },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: Date.now(),
            method: "tools/call",
            params: { name, arguments: args },
          }),
        });
        if (!res.ok) {
          throw new Error(`Server responded with status ${res.status}`);
        }
        return await res.json();
      } catch (err) {
        showError(err.message);
        throw err;
      }
    }

    function parseTasksJson(result) {
      const blocks = result?.result?.content || [];
      for (const block of blocks) {
        try {
          const parsed = JSON.parse(block.text);
          if (Array.isArray(parsed)) return parsed;
        } catch (e) {}
      }
      return null;
    }

    async function addTask() {
      const title = document.getElementById("taskInput").value.trim();
      const dueDate = document.getElementById("dueInput").value;
      if (!title) return;
      try {
        await callTool("add_task", dueDate ? { title, dueDate } : { title });
        document.getElementById("taskInput").value = "";
        document.getElementById("dueInput").value = "";
        loadTasks();
      } catch (e) {}
    }

    async function completeTaskById(id) {
      try {
        await callTool("complete_task", { id });
        loadTasks();
      } catch (e) {}
    }

    async function loadTasks() {
      try {
        const result = await callTool("list_tasks", {});
        const tasks = parseTasksJson(result);
        const listEl = document.getElementById("taskList");

        if (!tasks || tasks.length === 0) {
          listEl.innerHTML = '<div class="empty">Nothing on the list yet.</div>';
          return;
        }

        listEl.innerHTML = tasks
          .map(
            (t) => `
            <div class="task">
              <span>
                <span class="task-title">${t.title}</span>
                ${t.dueDate ? `<span class="task-due">due ${t.dueDate}</span>` : ""}
              </span>
              <button class="done-btn" onclick="completeTaskById('${t.id}')">done</button>
            </div>
          `
          )
          .join("");
      } catch (e) {}
    }

    async function planDay() {
      try {
        const result = await callTool("plan_day", {});
        const text = result?.result?.content?.[0]?.text || "No plan available.";
        const out = document.getElementById("planOutput");
        out.textContent = text;
        out.style.display = "block";
      } catch (e) {}
    }

    loadTasks();
  </script>
</body>
</html>
